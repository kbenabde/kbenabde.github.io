- title: Apprentissage statistique pour la détection de fraudes dans les télécommunications
  description:
  - 'Un appel téléphonique entre deux entités (appelant, appelé) situées dans des zones géographiques éloignées (à l’échelle mondiale) se fait à travers une série d’opérateurs interconnectés les uns avec les autres. Dans cette série chaque opérateur intermédiaire facture à son appelant l’appel reçu pour permettre son acheminement jusqu’au destinataire final. Ceci dit, l’opérateur de ce dernier possède donc une part de bénéfice grâce à cet appel établi. Cependant, il s’avère qu’un intermédiaire « mystère », qu’on appellera « SIM-Box » et qui appartient au même réseau que le destinataire final, peut contracter une ou plusieurs formules d’appels illimités avec lui, ce qui est légal, par contre il construit une interconnexion via Internet (par voix IP par exemple) avec l’opérateur de l’appelant. Ce dernier cheminement est illégal et constitue une fraude pour l''opérateur du destinataire final qui affiche des pertes financières importantes. Pour détecter ce type de fraudes, il existe actuellement deux solutions. La première dite par filtrage sur rapports et qui consiste à détecter les SIM qui effectuent plusieurs appels, à plusieurs destinataires, qui ne reçoivent pas d’appels, qui n’émettent pas de SMS, etc. Cependant, cette solution est généralement contournée par les fraudeurs et ne constitue pas un argument juridique solide en cas de résiliation de contrat pour cause de fraudes ! La seconde solution consiste à investir dans une série d’abonnements, qu’on appellera routes, pour effectuer une campagne d’appels entre les opérateurs associés et l’opérateur « victime » (l’opérateur client) pour analyser et détecter le maximum de fraudes à partir de cartes SIM différentes dans un environnement sous plusieurs contraintes liées : au nombre maximum d’appels par mois, nombre maximum de routes différentes par mois, nombre minimum d’appels par route et au nombre minimum de routes de types (Fixe, GSM, SIP ou Calling Card). La problématique qui découle de ce stage consiste à répondre aux questions suivantes : Ayant M routes et limité par N appels possibles : 1) comment lister les M’ routes potentielles parmi les M disponibles, 2) Quel poids attribuer à une route (un poids d’une route détermine le nombre d’appels à effectuer par cette route), et 3) comment déterminer un paramètre de régulation sur ces routes. Actuellement, la campagne d’appels est effectuée de manière aléatoire avec une intervention constante des experts du domaine mais qui ne garantit aucunement l’optimisation du nombre de fraudes détectées. Dans le cadre de ce stage, nous proposons de développer une approche automatique basée sur l’apprentissage statistique pour déterminer, particulièrement, le poids pour chaque route afin de détecter le maximum de fraudes sous les contraintes citées ci-dessus. Le stage sera contraint par une close de confidentialité et sera effectué en collaboration avec une société spécialisée dans le monitoring en Télécoms.'
